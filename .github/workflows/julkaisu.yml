# TESTIMOSKEIJA: rakennetaan pohjan testi-haarasta, jotta uudet ominaisuudet voi testata ennen kuin ne
# julkaistaan kaikille (paneeli → Testaus ja julkaisu). Pohjan testi-haaran muutos käynnistää tämän
# (repository_dispatch pohja-testi). Muilla moskeijoilla on @main.
# Ajetaan aina kun tietoja muutetaan, kerran tunnissa (rukousajat, Instagram) ja käsin.
name: Julkaise sivusto

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [pohja-testi]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sivu:
    uses: suomen-moskeijat/pohja/.github/workflows/rakenna.yml@testi
    with:
      pohja_versio: testi
